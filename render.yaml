services:
  - type: web
    name: wappify-backend
    runtime: node
    rootDir: wappify-backend
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_WEBHOOK_URL
        sync: false
      - key: BACKEND_INTERNAL_API_TOKEN
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: BASE_URL
        sync: false
